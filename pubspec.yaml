name: template_app
description: This is a template app created to start new Flutter projects quickly.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bcrypt: ^1.2.0
  bloc: ^9.2.1
  cupertino_icons: ^1.0.9
  decimal: ^3.2.4
  device_info_plus: ^13.1.0
  drift: ^2.33.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.2.3
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3: ^3.3.2
  uuid: ^4.5.3
  connectivity_plus: ^7.1.1
  local_auth: ^3.0.1
  sensors_plus: ^7.0.0
  mobile_scanner: ^7.2.0
  fl_chart: ^1.2.0
  lottie: ^3.3.3
  
  
dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/lotties/