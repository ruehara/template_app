# Lefthook Git Hooks Configuration
# Install: dart run lefthook install
# See: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files} && git add {staged_files}
      
    analyze:
      run: flutter analyze --no-fatal-infos
      
    # Uncomment to run codegen check on commit (slower)
    # codegen-check:
    #   run: |
    #     flutter gen-l10n
    #     dart run build_runner build --delete-conflicting-outputs

pre-push:
  commands:
    test:
      run: |
        flutter test \
          --dart-define=FLAVOR=test \
          --dart-define=API_KEY=test_key \
          --dart-define=BASE_URL=http://test.example.com \
          --dart-define=LOG_ERROR_API_URL=http://test.example.com/log \
          --dart-define=DB_SEED_ENABLED=false

