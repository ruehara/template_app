name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  setup:
    name: Setup & Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --fatal-infos --fatal-warnings

  codegen:
    name: Code Generation
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Generated files differ from committed files"
            echo "Run 'flutter gen-l10n && dart run build_runner build --delete-conflicting-outputs' locally"
            git diff
            exit 0
          fi

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: [format, analyze, codegen]
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (required for tests)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: |
          flutter test --coverage \
            --dart-define=FLAVOR=test \
            --dart-define=API_KEY=test_key \
            --dart-define=BASE_URL=http://test.example.com \
            --dart-define=LOG_ERROR_API_URL=http://test.example.com/log \
            --dart-define=DB_SEED_ENABLED=false

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

      - name: Coverage summary
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "Coverage file generated successfully"
            # Optional: Install and run lcov for summary
            # sudo apt-get install lcov
            # lcov --summary coverage/lcov.info
          fi

  build-android-dev:
    name: Build Android (Development)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (Development)
        run: |
          flutter build apk --flavor development \
            --dart-define=FLAVOR=development \
            --dart-define=API_KEY=dev_key_12345 \
            --dart-define=BASE_URL=https://dev.api.example.com \
            --dart-define=LOG_ERROR_API_URL=https://dev.api.example.com/log \
            --dart-define=DB_SEED_ENABLED=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-development-apk
          path: build/app/outputs/flutter-apk/app-development-release.apk
          retention-days: 30

  build-android-staging:
    name: Build Android (Staging)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (Staging)
        run: |
          flutter build apk --flavor staging \
            --dart-define=FLAVOR=staging \
            --dart-define=API_KEY=staging_key_67890 \
            --dart-define=BASE_URL=https://staging.api.example.com \
            --dart-define=LOG_ERROR_API_URL=https://staging.api.example.com/log \
            --dart-define=DB_SEED_ENABLED=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-staging-apk
          path: build/app/outputs/flutter-apk/app-staging-release.apk
          retention-days: 30

  build-android-production:
    name: Build Android (Production)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (Production)
        env:
          # In production, use secrets for sensitive values
          PROD_API_KEY: ${{ secrets.PROD_API_KEY || 'REPLACE_WITH_REAL_KEY' }}
        run: |
          flutter build apk --flavor production \
            --dart-define=FLAVOR=production \
            --dart-define=API_KEY=$PROD_API_KEY \
            --dart-define=BASE_URL=https://api.example.com \
            --dart-define=LOG_ERROR_API_URL=https://api.example.com/log \
            --dart-define=DB_SEED_ENABLED=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-production-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk
          retention-days: 90

  build-ios:
    name: Build iOS (Development)
    runs-on: macos-latest
    needs: [test]
    timeout-minutes: 45
    if: false  # Disabled by default - enable when iOS signing is configured
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (Development - No Codesign)
        run: |
          flutter build ios --no-codesign --flavor development \
            --dart-define=FLAVOR=development \
            --dart-define=API_KEY=dev_key_12345 \
            --dart-define=BASE_URL=https://dev.api.example.com \
            --dart-define=LOG_ERROR_API_URL=https://dev.api.example.com/log \
            --dart-define=DB_SEED_ENABLED=true

  security-scan:
    name: Security Scan (Secrets Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [format, analyze, codegen, test, build-android-dev]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "Pipeline completed"
          echo "Format: ${{ needs.format.result }}"
          echo "Analyze: ${{ needs.analyze.result }}"
          echo "Codegen: ${{ needs.codegen.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Build (Android Dev): ${{ needs.build-android-dev.result }}"
